# Railway 배포 설정
# 1) GitHub repo 연결 → 이 브랜치 배포
# 2) 영구 저장을 위해 Volume 을 /app/data 에 마운트하고 DB_PATH=/app/data/pdm.db 설정
#    (볼륨 없으면 재배포 시 SQLite 데이터가 초기화됨)
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
